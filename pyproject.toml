[project]
name = "route-optimizer"
version = "0.1.0"
description = "Django URL pattern optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
django = [
    "django>=4.2",
]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_optimizer"]

[tool.ruff]
line-length = 100
target-version = "py311"
